name: Torah Provider Contract Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  sefaria-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify documented read-only contracts
        shell: bash
        run: |
          set -euo pipefail
          fetch() { curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 "$1"; }
          fetch 'https://www.sefaria.org/api/name/Genesis%201?type=ref&limit=2' | jq -e '.completion_objects // .completions'
          fetch 'https://www.sefaria.org/api/ref/Genesis%201:1' | jq -e '.is_ref != false and (.ref | type == "string")'
          fetch 'https://www.sefaria.org/api/v2/topics/prayer' | jq -e '.slug == "prayer"'
          fetch 'https://www.sefaria.org/api/words/%D7%91%D7%A9%D7%A2%D7%A8%D7%99%D7%9A' | jq -e 'type == "array" or (.results | type == "array") or (.entries | type == "array")'
