name: Torah CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete existing unit, integration, and UI matrix
        required: false
        default: false
        type: boolean
      package_test_filter:
        description: Optional Swift Testing filter for a focused package test
        required: false
        default: ""
        type: string
      run_package_tests:
        description: Run all PinkhaTorah Swift package tests
        required: false
        default: false
        type: boolean
      run_ui_tests:
        description: Run the focused Torah UI tests for this dispatch
        required: false
        default: false
        type: boolean
      ui_test_filter:
        description: Optional only-testing selector for one focused iOS UI test
        required: false
        default: ""
        type: string

concurrency:
  group: torah-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Torah core and provider tests
    if: github.event_name == 'workflow_dispatch' && (inputs.full_suite == true || inputs.run_package_tests == true || inputs.package_test_filter != '')
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Swift package tests
        if: inputs.package_test_filter == '' && (inputs.full_suite == true || inputs.run_package_tests == true)
        run: swift test --package-path app/Packages/PinkhaTorah
      - name: Focused Swift package test
        if: inputs.package_test_filter != ''
        env:
          TEST_FILTER: ${{ inputs.package_test_filter }}
        run: swift test --package-path app/Packages/PinkhaTorah --filter "$TEST_FILTER"

  simulator:
    name: Real iOS simulator XCUITest
    if: github.event_name != 'workflow_dispatch' || inputs.run_ui_tests == true || inputs.full_suite == true
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Environment
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Build Pinkha Rust XCFramework
        run: ./extensions/torah/scripts/build-with-torah.sh
      - name: Build configuration
        run: |
          cp app/Config/Secrets.xcconfig.example app/Config/Secrets.xcconfig
          cd app
          xcodegen generate
      - name: Create and boot simulator
        id: simulator
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes --json | jq -r \
            '.runtimes | map(select(.isAvailable == true and (.name | startswith("iOS 27")))) | last | .identifier')
          [ -n "$RUNTIME" ] && [ "$RUNTIME" != "null" ] || { echo "::error::No available iOS 27 runtime"; exit 1; }
          UDID=""
          while IFS= read -r DEVICE_TYPE; do
            if CANDIDATE=$(xcrun simctl create "Pinkha Torah CI $GITHUB_RUN_ID" "$DEVICE_TYPE" "$RUNTIME" 2>/dev/null); then
              UDID="$CANDIDATE"
              break
            fi
          done < <(xcrun simctl list devicetypes --json | jq -r \
            '.devicetypes | map(select(.name | startswith("iPhone"))) | reverse[] | .identifier')
          [ -n "$UDID" ] || { echo "::error::No iPhone device type is compatible with $RUNTIME"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Focused Torah association UI tests
        if: github.event_name != 'workflow_dispatch' || inputs.full_suite != true
        env:
          UI_TEST_FILTER: ${{ inputs.ui_test_filter }}
        run: ./extensions/torah/scripts/run-torah-ui-tests.sh '${{ steps.simulator.outputs.udid }}' "$RUNNER_TEMP/PinkhaTests.xcresult" focused "$UI_TEST_FILTER"
      - name: Final full unit, integration, and UI suite
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite == true
        run: ./extensions/torah/scripts/run-torah-ui-tests.sh '${{ steps.simulator.outputs.udid }}' "$RUNNER_TEMP/PinkhaTests.xcresult" full
      - name: Collect simulator crash logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/simulator-logs"
          xcrun simctl spawn '${{ steps.simulator.outputs.udid }}' log show --last 20m --style compact \
            --predicate 'process == "Pinkha" OR eventMessage CONTAINS "Pinkha"' \
            > "$RUNNER_TEMP/simulator-logs/pinkha.log" 2>&1 || true
      - name: Upload XCTest result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinkha-torah-xcresult-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/PinkhaTests.xcresult
            ${{ runner.temp }}/simulator-logs
          if-no-files-found: warn
      - name: Delete temporary simulator
        if: always()
        run: xcrun simctl delete '${{ steps.simulator.outputs.udid }}' || true
